<script>
function toggleSettings(){
  const menu = document.getElementById("settingsMenu");
  menu.style.display =
  menu.style.display === "block" ? "none" : "block";
}

function toggleLanguages(){
  const lang = document.getElementById("languages");
  lang.style.display =
  lang.style.display === "block" ? "none" : "block";
}

function toggleTheme(){
  const theme = document.getElementById("themeMenu");
  theme.style.display =
  theme.style.display === "block" ? "none" : "block";
}

function setDarkMode(){
  document.body.style.background = "#111827";
  document.body.style.color = "white";
}

function setLightMode(){
  document.body.style.background = "white";
  document.body.style.color = "black";
}
</script>

<body>

<div style="position:fixed;top:15px;right:15px;z-index:999;">

<button onclick="toggleSettings()" style="
background:#1f2937;
color:white;
border:none;
padding:10px 15px;
border-radius:50%;
font-size:24px;
cursor:pointer;">
⚙️
</button>

<div id="settingsMenu" style="
display:none;
position:absolute;
right:0;
top:55px;
background:#1f2937;
padding:15px;
border-radius:10px;
width:220px;">



<button onclick="toggleTheme()" style="
width:100%;
padding:10px;
margin-top:10px;">
💡 الإضاءة
</button>

<div id="themeMenu" style="display:none;">
<button onclick="setDarkMode()" style="width:100%;padding:8px;">
🌙 Dark Mode
</button>

<button onclick="setLightMode()" style="width:100%;padding:8px;">
☀️ Light Mode
</button>
</div>

</div>






<script>
function toggleSettings(){
const menu=document.getElementById("settingsMenu");
menu.style.display=menu.style.display==="block"?"none":"block";
}

function toggleLanguages(){
const lang=document.getElementById("languages");
lang.style.display=lang.style.display==="block"?"none":"block";
}

function toggleTheme(){
const theme=document.getElementById("themeMenu");
theme.style.display=theme.style.display==="block"?"none":"block";
}

function setDarkMode(){
document.body.style.background="#111827";
document.body.style.color="white";
}

function setLightMode(){
document.body.style.background="white";
document.body.style.color="black";
}
</script>
